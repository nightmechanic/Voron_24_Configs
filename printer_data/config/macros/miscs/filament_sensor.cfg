[gcode_macro SFS_ENABLE]
description: Enable the Smart Filament Sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=btt_sfs_switch ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=btt_sfs_encoder ENABLE=1
  RESPOND MSG="SFS Enabled"

[gcode_macro SFS_DISABLE]
description: Disable the Smart Filament Sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=btt_sfs_switch ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=btt_sfs_encoder ENABLE=0
  RESPOND MSG="SFS Disabled"

[gcode_macro SFS_RUNOUT]
description: Action taken on filament runout or jam
gcode:
  RESPOND TYPE=error MSG="Filament Runout / Jam Detected!"
  PAUSE