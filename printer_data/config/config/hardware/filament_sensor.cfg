[filament_switch_sensor btt_sfs_switch]
switch_pin: ^SFS_SWITCH          # Switch/Runout signal pin (add pullup ^ if needed)
pause_on_runout: False
runout_gcode: SFS_RUNOUT

[filament_motion_sensor btt_sfs_encoder]
switch_pin: ^SFS_MOTION          # Encoder/Motion signal pin
detection_length: 10.0         # Adjust (in mm) based on bowden/direct drive slack
extruder: extruder
pause_on_runout: False
runout_gcode: SFS_RUNOUT